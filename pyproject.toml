[project]
name = "magezero"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.1",
    "flask>=2.3",
    "waitress>=2.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
legacy = ["scipy>=1.10", "h5py>=3.8", "pyroaring>=0.3.6", "msgpack>=1.0.5", "matplotlib>=3.7"]
test = ["pytest>=7.4"]

[project.scripts]
mz = "magezero.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
