[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "magezero"
version = "0.3.0"
description = "A search-free recurrent entity policy for two-player Magic: The Gathering, trained in XMage."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "flask>=2.3",
    "waitress>=2.1",
    "websockets>=13",
    "pyyaml>=6.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Games/Entertainment",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]
dev = ["pytest>=7.4", "ruff==0.6.9"]

[project.scripts]
mz = "magezero.cli:main"

[project.urls]
Repository = "https://github.com/ContrattoAlessandro/MTG_AI"
Upstream = "https://github.com/WillWroble/MageZero"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
magezero = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import order
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplifications
    "C4",  # comprehensions
    "N",   # naming
    "RUF", # ruff-specific
]
ignore = [
    "B905",   # zip(strict=...): lengths are validated where they matter
    "RUF001", # en dashes and other typographic characters in strings are intentional
    "SIM108", # ternaries are not always clearer
    "UP038",  # isinstance(x, (a, b)) is fine
]

[tool.ruff.lint.isort]
known-first-party = ["magezero"]
known-local-folder = ["helpers"]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint.per-file-ignores]
"scripts/commander_roles.py" = ["E501"]  # a table of reviewed card annotations with long notes
