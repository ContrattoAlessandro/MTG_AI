# Locked configuration for the final run. Learning settings are the only ones that
# showed learning (configs/policy-cpu-30min.yml, docs/cpu-training-2026-10-12.md):
# GAE lambda 1.0, auxiliary belief off, two epochs, learning rate 0.0003. Untested
# alternatives (lambda 0.97, auxiliary belief) stay in configs/policy.yml.
model:
  belief_mode: statistical_roles
  auxiliary_belief: false
  width: 256
  entity_layers: 2
  attention_heads: 4
  max_hand_size: 64
  max_entities: 512
  max_actions: 2048
  # Kinnan mana loops can emit thousands of events between two decisions.
  max_events: 8192
  max_relations: 2048
  max_deck_kinds: 128

training:
  learning_rate: 0.0003
  epochs: 2
  # GPU batch width and optimizer minibatch. 16 was within 7% of 32 on the shared
  # RTX 5070 (566 vs 607 decisions/s) and keeps twice the optimizer steps per
  # generation (8 per epoch for 64 games). Re-check on an idle GPU.
  episodes_per_batch: 16
  sequence_length: 32
  # Trajectories per no-gradient forward pass when computing PPO targets.
  target_batch_episodes: 64
  gamma: 1.0
  # Full terminal-return credit across the many micro-decisions in a game.
  gae_lambda: 1.0
  clip_ratio: 0.2
  value_coefficient: 0.5
  public_value_coefficient: 0.25
  belief_coefficient: 0.0
  entropy_coefficient: 0.01
  max_grad_norm: 1.0
  target_kl: 0.02
