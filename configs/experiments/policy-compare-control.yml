# A5 comparison control (notes/review-handoff.md): policy-final.yml with the
# pre-review credit assignment, lambda 1.0, no shaping, no KL. Arm (a) runs it from
# commander-initial.pt; arm (c) from commander-cloned.pt, to separate the warm start
# from the lambda/shaping/KL change. Arm (b) is policy-final.yml itself.
model:
  belief_mode: statistical_roles
  auxiliary_belief: false
  width: 256
  entity_layers: 2
  attention_heads: 4
  max_hand_size: 64
  max_entities: 512
  max_actions: 2048
  # Kinnan mana loops can emit thousands of events between two decisions.
  max_events: 8192
  max_relations: 2048
  max_deck_kinds: 128

training:
  learning_rate: 0.0003
  epochs: 2
  # GPU batch width and optimizer minibatch. 16 was within 7% of 32 on the shared
  # RTX 5070 (566 vs 607 decisions/s) and keeps twice the optimizer steps per
  # generation (8 per epoch for 64 games). Re-check on an idle GPU.
  episodes_per_batch: 16
  sequence_length: 32
  # Trajectories per no-gradient forward pass when computing PPO targets.
  target_batch_episodes: 64
  gamma: 1.0
  # Control: Monte Carlo advantages, terminal reward only, no KL (as before the
  # review). In arm (c) the clone's value heads were pre-trained on shaped (0.5)
  # returns; at lambda 1 the critic is only a baseline, so this adds variance, not bias.
  gae_lambda: 1.0
  shaping_coefficient: 0.0
  reference_kl_coefficient: 0.0
  reference_kl_decay: 0.999
  clip_ratio: 0.2
  value_coefficient: 0.5
  public_value_coefficient: 0.25
  belief_coefficient: 0.0
  entropy_coefficient: 0.01
  max_grad_norm: 1.0
  target_kl: 0.02

# mz clone: behaviour cloning on mz teacher-collect trajectories.
clone:
  learning_rate: 0.0003
  epochs: 10
  episodes_per_batch: 16
  sequence_length: 32
  value_coefficient: 0.5
  public_value_coefficient: 0.25
  validation_fraction: 0.1
  shaping_coefficient: 0.5
  gamma: 1.0
