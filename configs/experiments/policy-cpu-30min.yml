model:
  belief_mode: statistical_roles
  width: 256
  entity_layers: 2
  attention_heads: 4
training:
  learning_rate: 0.0003
  epochs: 2
  episodes_per_batch: 4
  sequence_length: 32
  gamma: 1.0
  # Full terminal-return credit across the many micro-decisions in a game.
  gae_lambda: 1.0
  clip_ratio: 0.2
  value_coefficient: 0.5
  public_value_coefficient: 0.25
  belief_coefficient: 0.0
  entropy_coefficient: 0.01
  max_grad_norm: 1.0
  target_kl: 0.02
