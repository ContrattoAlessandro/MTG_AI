<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MageZero Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #07090c;
  --felt-1: #12241f; --felt-2: #0b1714; --felt-edge: #050807;
  --glass: rgba(16, 21, 27, .8); --glass-2: rgba(26, 33, 41, .92); --glass-3: rgba(42, 51, 61, .95);
  --line: rgba(255, 255, 255, .08); --line-2: rgba(255, 255, 255, .15);
  --text: #eef2f6; --text-2: #b4bfca; --text-3: #7d8a97;
  --gold: #e6b450; --gold-2: #f5d27e; --gold-ink: #2a1d05;
  --you: #4ea8ff; --bot: #ff6f61; --good: #4fd18b; --bad: #ff6b6b; --warn: #ffb547;
  --cw: clamp(58px, 5.3vw, 104px);            /* battlefield card width */
  --ch: calc(var(--cw) * 1.396);
  --hw: clamp(78px, 6.9vw, 134px);            /* hand card width */
  --hh: calc(var(--hw) * 1.396);
  --rail: clamp(200px, 15vw, 240px);
  --side: clamp(300px, 24vw, 380px);
  --shadow: 0 10px 30px rgba(0, 0, 0, .45);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
  font: 14px/1.4 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
.ms { display: inline-block; width: 1.05em; height: 1.05em; vertical-align: -0.16em; margin: 0 .5px; filter: drop-shadow(0 1px 0 rgba(0,0,0,.6)); }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line-2);
  background: var(--glass-2); border-radius: 10px; padding: 8px 14px; cursor: pointer; font-weight: 600; font-size: 13px;
  transition: background .15s, border-color .15s, transform .08s, filter .15s; white-space: nowrap; }
.btn:hover { border-color: rgba(230, 180, 80, .6); background: var(--glass-3); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: default; pointer-events: none; }
.btn.gold { background: linear-gradient(180deg, var(--gold-2), var(--gold)); color: var(--gold-ink); border-color: transparent;
  box-shadow: 0 4px 16px rgba(230, 180, 80, .22), inset 0 1px 0 rgba(255,255,255,.45); }
.btn.gold:hover { filter: brightness(1.07); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.danger:hover { border-color: rgba(255, 107, 107, .7); color: #ffd0cc; }
.btn.icon { padding: 0; width: 34px; height: 34px; }
.kbd { font: 600 10px/1 Inter, sans-serif; padding: 3px 5px; border-radius: 5px; border: 1px solid currentColor; opacity: .55; }

/* ---------- top bar ---------- */
#app { display: grid; grid-template-rows: 54px 1fr; height: 100vh; }
.topbar { display: flex; align-items: center; gap: 14px; padding: 0 16px; background: linear-gradient(180deg, #131a23, #0c1117);
  border-bottom: 1px solid var(--line); position: relative; z-index: 5; }
.brand { display: flex; align-items: center; gap: 10px; font: 700 18px/1 Cinzel, serif; letter-spacing: .6px; }
.brand svg { width: 28px; height: 28px; }
.brand b { color: var(--gold); font-weight: 700; }
.matchup { color: var(--text-2); font-size: 13px; display: flex; align-items: center; gap: 8px; margin-left: 10px; padding-left: 14px; border-left: 1px solid var(--line); }
.matchup .vs { color: var(--text-3); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
.matchup .you { color: var(--you); font-weight: 600; } .matchup .bot { color: var(--bot); font-weight: 600; }
.status { margin-left: auto; display: flex; align-items: center; gap: 8px; color: var(--text-2); font-size: 13px; min-width: 0; }
.status span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-3); flex: none; }
.dot.live { background: var(--good); box-shadow: 0 0 0 3px rgba(79, 209, 139, .2); }
.dot.wait { background: var(--warn); animation: pulse 1.2s infinite; }
.dot.err { background: var(--bad); }
@keyframes pulse { 50% { opacity: .35; } }
.tools { display: flex; gap: 8px; }

/* ---------- layout ---------- */
main { display: grid; grid-template-columns: 1fr var(--side); min-height: 0; }
.table { position: relative; min-height: 0; display: grid; grid-template-columns: var(--rail) minmax(0, 1fr);
  grid-template-rows: minmax(0, 1fr) auto minmax(0, 1fr) auto;
  background: radial-gradient(120% 90% at 55% 50%, var(--felt-1) 0%, var(--felt-2) 62%, var(--felt-edge) 100%); overflow: hidden; }
.table::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .55;
  background-image: radial-gradient(rgba(255,255,255,.028) 1px, transparent 1px); background-size: 4px 4px; }
.rail { padding: 12px 10px 12px 12px; display: flex; flex-direction: column; min-height: 0; position: relative; z-index: 2; overflow: auto; scrollbar-width: none; }
.rail.me { justify-content: flex-end; }
.field { position: relative; min-height: 0; overflow: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px;
  scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.12) transparent; }
.field.opp > :first-child { margin-top: auto; }
.lane { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px; }
.lane:empty { display: none; }
.lane .gap { width: 14px; flex: none; }
.center { grid-column: 1 / -1; display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); align-items: center; position: relative; z-index: 2;
  border-top: 1px solid rgba(255,255,255,.05); border-bottom: 1px solid rgba(255,255,255,.05);
  background: linear-gradient(90deg, rgba(0,0,0,.42), rgba(0,0,0,.2) 40%, rgba(0,0,0,.42)); min-height: 54px; }
.turnchip { margin: 0 10px 0 14px; display: flex; align-items: center; gap: 10px; }
.turnchip .num { font: 800 24px/1 Inter, sans-serif; color: var(--gold); min-width: 28px; text-align: center; }
.turnchip .who { font-size: 10px; text-transform: uppercase; letter-spacing: 1.3px; color: var(--text-3); line-height: 1.25; }
.turnchip .who b { display: block; font-size: 13px; letter-spacing: .2px; text-transform: none; }
.turnchip .who b.you { color: var(--you); } .turnchip .who b.opponent { color: var(--bot); }
.centerbody { display: flex; align-items: center; gap: 14px; padding: 7px 14px 7px 0; min-width: 0; }
.phases { display: flex; gap: 2px; padding: 3px; background: rgba(0,0,0,.4); border: 1px solid var(--line); border-radius: 10px; flex: none; }
.phases span { font-size: 10.5px; font-weight: 700; letter-spacing: .5px; color: var(--text-3); padding: 5px 6px; border-radius: 7px; min-width: 27px; text-align: center; transition: background .2s, color .2s; }
.phases span.main { color: var(--text-2); }
.phases span.on { color: #061019; background: var(--you); box-shadow: 0 0 14px rgba(78,168,255,.45); }
.phases.opponent span.on { background: var(--bot); box-shadow: 0 0 14px rgba(255,111,97,.45); }
.stackzone { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.stackzone .hint { color: var(--text-3); font-size: 12.5px; white-space: nowrap; }
.stackzone .hint b { color: var(--text-2); font-weight: 600; }
.stackzone .label { font-size: 10.5px; font-weight: 700; letter-spacing: 1.3px; color: var(--gold); text-transform: uppercase; white-space: nowrap; }
.sobj { display: flex; align-items: center; gap: 9px; padding: 4px 12px 4px 4px; border-radius: 11px; background: var(--glass-2);
  border: 1px solid var(--line-2); max-width: 360px; flex: none; animation: pop .25s ease-out; }
.sobj.you { border-color: rgba(78,168,255,.55); } .sobj.opponent { border-color: rgba(255,111,97,.55); }
.sobj.top { box-shadow: 0 0 0 2px rgba(230,180,80,.45), 0 6px 18px rgba(0,0,0,.4); }
.sobj .thumb { width: 36px; height: 36px; border-radius: 8px; background: #222 center 25%/cover; flex: none; }
.sobj .t { min-width: 0; }
.sobj .t b { display: block; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sobj .t span { display: block; font-size: 11px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 290px; }
@keyframes pop { from { transform: scale(.9); opacity: 0; } }

/* ---------- seat panels ---------- */
.seat { background: var(--glass); backdrop-filter: blur(8px); border: 1px solid var(--line); border-radius: 14px; padding: 12px;
  box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; transition: border-color .2s, box-shadow .2s; }
.seat.you.active { border-color: rgba(78,168,255,.45); box-shadow: var(--shadow), 0 0 26px rgba(78,168,255,.14); }
.seat.opponent.active { border-color: rgba(255,111,97,.45); box-shadow: var(--shadow), 0 0 26px rgba(255,111,97,.14); }
.seat.can { cursor: pointer; border-color: var(--gold); animation: seatglow 2.2s ease-in-out infinite; }
.seat.marked { border-color: #fff; }
@keyframes seatglow { 50% { box-shadow: var(--shadow), 0 0 0 2px rgba(230,180,80,.5), 0 0 26px rgba(230,180,80,.35); } }
.seat .who { display: flex; align-items: center; gap: 10px; }
.avatar { width: 46px; height: 46px; border-radius: 50%; background: #1b2229 center 25%/cover; flex: none;
  border: 2px solid var(--line-2); box-shadow: 0 4px 12px rgba(0,0,0,.45); }
.seat.you .avatar { border-color: var(--you); } .seat.opponent .avatar { border-color: var(--bot); }
.seat .who > div:nth-child(2) { min-width: 0; }
.seat .name { font-weight: 700; font-size: 14px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seat .sub { font-size: 11.5px; color: var(--text-3); }
.life { margin-left: auto; text-align: right; }
.life b { display: block; font: 800 30px/1 Inter, sans-serif; letter-spacing: -.5px; transition: color .4s; }
.life span { font-size: 9.5px; letter-spacing: 1.3px; text-transform: uppercase; color: var(--text-3); }
.life.hit b { color: var(--bad); animation: shake .35s; } .life.heal b { color: var(--good); }
@keyframes shake { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
.chips { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.chip { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 9px; background: rgba(255,255,255,.04);
  border: 1px solid var(--line); font-size: 11.5px; color: var(--text-2); min-width: 0; }
.chip { overflow: hidden; white-space: nowrap; }
.chip b { margin-left: auto; color: var(--text); font-weight: 700; }
.chip svg { width: 14px; height: 14px; opacity: .7; flex: none; }
button.chip { cursor: pointer; text-align: left; }
button.chip:hover { border-color: var(--line-2); background: rgba(255,255,255,.08); }
.chip.alert { border-color: rgba(255,107,107,.45); color: #ffc9c4; }
.pool { display: flex; gap: 4px; flex-wrap: wrap; }
.pool span { display: inline-flex; align-items: center; gap: 3px; padding: 2px 7px 2px 3px; background: rgba(0,0,0,.35); border-radius: 12px; font-weight: 700; font-size: 12px; }
.cmdzone { display: flex; gap: 10px; align-items: center; padding-top: 2px; }
.cmdzone .card { --cw: 44px; position: relative; flex: none; }
.cmdzone .lbl { font-size: 11px; color: var(--text-3); line-height: 1.35; min-width: 0; }
.cmdzone .lbl b { display: block; color: var(--text-2); font-size: 10px; letter-spacing: 1.1px; text-transform: uppercase; }
.backs { display: flex; padding-left: 8px; height: 30px; }
.backs i { width: 21px; height: 30px; margin-left: -9px; border-radius: 3px; border: 1px solid rgba(0,0,0,.7);
  background: radial-gradient(ellipse 40% 30% at 50% 50%, #c08a3e 0 40%, #6b4519 41% 60%, transparent 62%), linear-gradient(135deg, #3d2b19, #1b120a);
  box-shadow: 1px 1px 3px rgba(0,0,0,.5); }

/* ---------- cards ---------- */
.slot { position: relative; flex: none; width: var(--cw); height: var(--ch); transition: width .22s ease; }
.slot.tapped { width: var(--ch); }
.slot.has-att { margin-top: calc(var(--ch) * .2); }
.card { position: absolute; left: 0; top: 0; width: var(--cw); height: calc(var(--cw) * 1.396); border-radius: calc(var(--cw) * .055);
  background: #1e252c; overflow: hidden; box-shadow: 0 3px 8px rgba(0,0,0,.55), 0 0 0 1px rgba(0,0,0,.6);
  transition: transform .22s ease, box-shadow .15s, filter .2s; cursor: default; user-select: none; }
.slot.tapped > .card { transform: translateX(calc((var(--ch) - var(--cw)) / 2)) rotate(90deg); }
.card img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
.card.dim { filter: saturate(.2) brightness(.5); }
.card .frame { position: absolute; inset: 0; padding: 7% 8%; display: flex; flex-direction: column; gap: 3%;
  background: linear-gradient(160deg, var(--f1, #4a5560), var(--f2, #20262c)); border: max(2px, calc(var(--cw) * .035)) solid #0c0f12; border-radius: inherit; }
.card .frame .nm { font-weight: 700; font-size: max(8.5px, calc(var(--cw) * .112)); line-height: 1.15; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
.card .frame .cs { font-size: max(8px, calc(var(--cw) * .1)); }
.card .frame .tp { font-size: max(7px, calc(var(--cw) * .084)); color: rgba(255,255,255,.75); border-top: 1px solid rgba(255,255,255,.2); padding-top: 4%; }
.card .frame .tx { font-size: max(6.5px, calc(var(--cw) * .076)); color: rgba(255,255,255,.85); overflow: hidden; line-height: 1.25; flex: 1; }
.card .frame .ms { width: .95em; height: .95em; }
.badge { position: absolute; z-index: 2; font-weight: 800; font-size: max(9.5px, calc(var(--cw) * .12)); line-height: 1; padding: 3px 5px; border-radius: 6px;
  background: rgba(10, 12, 15, .9); color: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.6); white-space: nowrap; pointer-events: none; }
.badge.pt { right: 4%; bottom: 3%; border: 1px solid rgba(255,255,255,.28); }
.badge.pt.hurt { color: #ffb1a8; border-color: rgba(255,107,107,.65); }
.badge.cnt { left: 4%; top: 4%; background: var(--gold); color: var(--gold-ink); }
.badge.ctr { left: 4%; bottom: 3%; background: rgba(18, 76, 46, .94); color: #bdf7d4; max-width: 60%; overflow: hidden; text-overflow: ellipsis; }
.badge.sick { right: 4%; top: 4%; font-size: max(8.5px, calc(var(--cw) * .1)); color: #ffd58a; }
.badge.combat { left: 50%; top: 42%; transform: translate(-50%, -50%); font-size: max(9px, calc(var(--cw) * .105)); padding: 4px 6px; letter-spacing: .3px; }
.badge.combat.atk { background: rgba(196, 48, 38, .94); }
.badge.combat.blk { background: rgba(28, 104, 196, .94); }
.badge.phase { left: 50%; top: 50%; transform: translate(-50%, -50%); background: rgba(70, 70, 110, .92); }
.slot > .card { z-index: 1; }
.slot.stacked::before, .slot.stacked::after { content: ""; position: absolute; z-index: 0; left: 0; top: 0; width: var(--cw); height: var(--ch);
  border-radius: calc(var(--cw) * .055); background: #12161a; box-shadow: 0 0 0 1px rgba(0,0,0,.65); }
.slot.stacked::before { transform: translate(6px, -6px); } .slot.stacked::after { transform: translate(3px, -3px); }
.slot.tapped.stacked::before { transform: translate(calc((var(--ch) - var(--cw)) / 2 + 6px), -6px) rotate(90deg); }
.slot.tapped.stacked::after { transform: translate(calc((var(--ch) - var(--cw)) / 2 + 3px), -3px) rotate(90deg); }
.card.attacking { box-shadow: 0 0 0 2px var(--bot), 0 0 18px rgba(255,111,97,.6); }
.card.blocking { box-shadow: 0 0 0 2px var(--you), 0 0 18px rgba(78,168,255,.6); }
.card.can { cursor: pointer; animation: glow 2.2s ease-in-out infinite; }
@keyframes glow { 0%, 100% { box-shadow: 0 0 0 2px var(--gold), 0 0 12px rgba(230,180,80,.45); } 50% { box-shadow: 0 0 0 2px var(--gold-2), 0 0 24px rgba(230,180,80,.8); } }
.card.can:hover { filter: brightness(1.12); }
.slot:not(.tapped) > .card.can:hover { transform: translateY(-6px); }
.card.marked { animation: none; box-shadow: 0 0 0 3px #fff, 0 0 24px rgba(255,255,255,.7) !important; }
.att { position: absolute; left: 0; width: var(--cw); }
.att .card { position: relative; }

/* ---------- hand ---------- */
.handbar { grid-column: 1 / -1; position: relative; height: calc(var(--hh) * .68 + 14px); z-index: 4;
  background: linear-gradient(180deg, transparent, rgba(0,0,0,.5)); }
.hand { position: absolute; left: 50%; bottom: calc(var(--hh) * -.32); transform: translateX(-50%); display: flex; align-items: flex-end; padding: 0 24px; }
.hand .hc { position: relative; width: var(--hw); height: var(--hh); flex: none; margin: 0 calc(var(--overlap, 0px) * -1);
  transition: transform .18s ease; transform-origin: 50% 130%; }
.hand .hc .card { --cw: var(--hw); }
.hand .hc:hover { transform: translateY(calc(var(--hh) * -.3)) scale(1.08) !important; z-index: 30 !important; }
.hand .hc .card.can:hover { transform: none; }
.hand-label { position: absolute; left: 16px; bottom: 12px; font-size: 10.5px; letter-spacing: 1.3px; text-transform: uppercase; color: var(--text-3); }

/* ---------- side panel ---------- */
aside { display: flex; flex-direction: column; min-height: 0; background: linear-gradient(180deg, #0f141a, #0b0f13); border-left: 1px solid var(--line); }
.panel-h { display: flex; align-items: center; gap: 8px; font-size: 10.5px; font-weight: 700; letter-spacing: 1.3px; text-transform: uppercase; color: var(--text-3); }
.decision { padding: 16px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; position: relative; min-height: 150px; }
.decision.mine { background: linear-gradient(180deg, rgba(230,180,80,.1), transparent 75%); }
.decision.mine::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--gold); }
.kind { padding: 3px 8px; border-radius: 6px; background: rgba(230,180,80,.16); color: var(--gold-2); }
.kind.waiting { background: rgba(255,255,255,.06); color: var(--text-3); }
.prompt { font-size: 16px; font-weight: 600; line-height: 1.35; }
.prompt .src { display: block; font-size: 12.5px; color: var(--text-2); font-weight: 500; margin-top: 4px; }
.opts { display: flex; flex-direction: column; gap: 6px; max-height: 40vh; overflow: auto; margin: 0 -4px; padding: 2px 4px;
  scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.14) transparent; }
.opt { display: flex; align-items: center; gap: 10px; text-align: left; padding: 6px 10px 6px 6px; border-radius: 10px; cursor: pointer;
  background: rgba(255,255,255,.04); border: 1px solid var(--line); transition: background .12s, border-color .12s; width: 100%; }
.opt:hover { background: rgba(230,180,80,.1); border-color: rgba(230,180,80,.5); }
.opt .thumb { width: 34px; height: 34px; border-radius: 8px; background: #20272e center 25%/cover; flex: none; border: 1px solid rgba(0,0,0,.4);
  display: grid; place-items: center; color: var(--text-3); font-size: 15px; font-weight: 700; }
.opt .lbl { flex: 1; min-width: 0; font-size: 13px; font-weight: 500; }
.opt .kbd { flex: none; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.actions .btn { flex: 1; padding: 11px 14px; font-size: 14px; }
.amount { display: flex; flex-direction: column; gap: 10px; }
.amount .row { display: flex; align-items: center; gap: 10px; }
.amount input[type=range] { flex: 1; accent-color: var(--gold); }
.amount input[type=number] { width: 84px; padding: 8px; border-radius: 9px; border: 1px solid var(--line-2); background: rgba(0,0,0,.35); color: var(--text); font: 600 15px Inter, sans-serif; text-align: center; }
.revealed { display: flex; flex-wrap: wrap; gap: 6px; --cw: 58px; }
.revealed .card { position: relative; }
.thinking { display: flex; align-items: center; gap: 12px; color: var(--text-2); }
.thinking .avatar { width: 40px; height: 40px; border-color: var(--bot); animation: breathe 1.8s ease-in-out infinite; }
@keyframes breathe { 50% { box-shadow: 0 0 0 7px rgba(255,111,97,.12); } }
.dots i { display: inline-block; width: 5px; height: 5px; margin: 6px 1.5px 0; border-radius: 50%; background: var(--text-2); animation: bounce 1.2s infinite; }
.dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
@keyframes bounce { 0%, 80%, 100% { transform: translateY(0); opacity: .4; } 40% { transform: translateY(-4px); opacity: 1; } }
.flow { padding: 12px 16px 14px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.flow .row { display: flex; gap: 8px; }
.flow .row .btn { flex: 1; padding: 7px 8px; font-size: 12px; }
.passing { font-size: 12px; color: var(--gold-2); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.passing:empty { display: none; }
.passing button { background: none; border: 0; color: var(--text-2); cursor: pointer; text-decoration: underline; font-size: 12px; }
.toggle { display: flex; align-items: flex-start; gap: 10px; font-size: 12.5px; color: var(--text-2); cursor: pointer; user-select: none; }
.toggle input { position: absolute; opacity: 0; pointer-events: none; }
.toggle .sw { flex: none; width: 30px; height: 17px; border-radius: 10px; background: rgba(255,255,255,.14); position: relative; transition: background .15s; margin-top: 1px; }

const tokenWaits = new Map();
