<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MageZero Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #07090c;
  --felt-1: #12241f; --felt-2: #0b1714; --felt-edge: #050807;
  --glass: rgba(16, 21, 27, .8); --glass-2: rgba(26, 33, 41, .92); --glass-3: rgba(42, 51, 61, .95);
  --line: rgba(255, 255, 255, .08); --line-2: rgba(255, 255, 255, .15);
  --text: #eef2f6; --text-2: #b4bfca; --text-3: #7d8a97;
  --gold: #e6b450; --gold-2: #f5d27e; --gold-ink: #2a1d05;
  --you: #4ea8ff; --bot: #ff6f61; --good: #4fd18b; --bad: #ff6b6b; --warn: #ffb547;
  --cw: clamp(58px, 5.3vw, 104px);            /* battlefield card width */
  --ch: calc(var(--cw) * 1.396);
  --hw: clamp(78px, 6.9vw, 134px);            /* hand card width */
  --hh: calc(var(--hw) * 1.396);
  --rail: clamp(200px, 15vw, 240px);
  --side: clamp(300px, 24vw, 380px);
  --flow: clamp(104px, 7.5vw, 132px);           /* match flow column */
  --shadow: 0 10px 30px rgba(0, 0, 0, .45);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
  font: 14px/1.4 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
.ms { display: inline-block; width: 1.05em; height: 1.05em; vertical-align: -0.16em; margin: 0 .5px; filter: drop-shadow(0 1px 0 rgba(0,0,0,.6)); }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line-2);
  background: var(--glass-2); border-radius: 10px; padding: 8px 14px; cursor: pointer; font-weight: 600; font-size: 13px;
  transition: background .15s, border-color .15s, transform .08s, filter .15s; white-space: nowrap; }
.btn:hover { border-color: rgba(230, 180, 80, .6); background: var(--glass-3); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: default; pointer-events: none; }
.btn.gold { background: linear-gradient(180deg, var(--gold-2), var(--gold)); color: var(--gold-ink); border-color: transparent;
  box-shadow: 0 4px 16px rgba(230, 180, 80, .22), inset 0 1px 0 rgba(255,255,255,.45); }
.btn.gold:hover { filter: brightness(1.07); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.danger:hover { border-color: rgba(255, 107, 107, .7); color: #ffd0cc; }
.btn.icon { padding: 0; width: 34px; height: 34px; }
.kbd { font: 600 10px/1 Inter, sans-serif; padding: 3px 5px; border-radius: 5px; border: 1px solid currentColor; opacity: .55; }

/* ---------- top bar ---------- */
#app { display: grid; grid-template-rows: 54px 1fr; height: 100vh; }
.topbar { display: flex; align-items: center; gap: 14px; padding: 0 16px; background: linear-gradient(180deg, #131a23, #0c1117);
  border-bottom: 1px solid var(--line); position: relative; z-index: 5; }
.brand { display: flex; align-items: center; gap: 10px; font: 700 18px/1 Cinzel, serif; letter-spacing: .6px; }
.brand svg { width: 28px; height: 28px; }
.brand b { color: var(--gold); font-weight: 700; }
.matchup { color: var(--text-2); font-size: 13px; display: flex; align-items: center; gap: 8px; margin-left: 10px; padding-left: 14px; border-left: 1px solid var(--line); }
.matchup .vs { color: var(--text-3); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
.matchup .you { color: var(--you); font-weight: 600; } .matchup .bot { color: var(--bot); font-weight: 600; }
.status { margin-left: auto; display: flex; align-items: center; gap: 8px; color: var(--text-2); font-size: 13px; min-width: 0; }
.status span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-3); flex: none; }
.dot.live { background: var(--good); box-shadow: 0 0 0 3px rgba(79, 209, 139, .2); }
.dot.wait { background: var(--warn); animation: pulse 1.2s infinite; }
.dot.err { background: var(--bad); }
@keyframes pulse { 50% { opacity: .35; } }
.tools { display: flex; gap: 8px; }

/* ---------- layout ---------- */
main { display: grid; grid-template-columns: minmax(0, 1fr) var(--side) var(--flow); min-height: 0; }
.table { position: relative; min-height: 0; display: grid; grid-template-columns: var(--rail) minmax(0, 1fr);
  grid-template-rows: minmax(0, 1fr) minmax(0, 1fr) auto;
  background: radial-gradient(120% 90% at 55% 50%, var(--felt-1) 0%, var(--felt-2) 62%, var(--felt-edge) 100%); overflow: hidden; }
.table::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .55;
  background-image: radial-gradient(rgba(255,255,255,.028) 1px, transparent 1px); background-size: 4px 4px; }
.rail { padding: 12px 10px 12px 12px; display: flex; flex-direction: column; min-height: 0; position: relative; z-index: 2; overflow: auto; scrollbar-width: none; }
.rail.me { justify-content: flex-end; }
.field { position: relative; min-height: 0; overflow: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px;
  scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.12) transparent; }
.field.opp > :first-child { margin-top: auto; }
.lane { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px; }
.lane:empty { display: none; }
.lane .gap { width: 14px; flex: none; }
.field.me { border-top: 1px solid rgba(255,255,255,.07); }

/* ---------- match flow (right column) ---------- */
.flowcol { display: flex; flex-direction: column; gap: 8px; min-height: 0; padding: 12px 10px; overflow: auto; scrollbar-width: none;
  background: linear-gradient(180deg, #0d1217, #090c10); border-left: 1px solid var(--line); }
.turnbox { text-align: center; padding: 10px 6px 9px; border-radius: 10px; border: 1px solid var(--line-2); background: rgba(255,255,255,.03); }
.turnbox small { display: block; font-size: 10px; font-weight: 800; letter-spacing: 1.6px; text-transform: uppercase; color: var(--text-3); }
.turnbox b { display: block; font: 800 20px/1.15 Inter, sans-serif; margin-top: 2px; }
.turnbox i { display: block; font-size: 11px; color: var(--text-3); font-style: normal; }
.turnbox.you { border-color: rgba(78,168,255,.55); background: linear-gradient(180deg, rgba(78,168,255,.14), transparent); }
.turnbox.you small { color: var(--you); }
.turnbox.opponent { border-color: rgba(255,111,97,.55); background: linear-gradient(180deg, rgba(255,111,97,.14), transparent); }
.turnbox.opponent small { color: var(--bot); }
.prio { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 5px 4px; border-radius: 8px; border: 1px solid var(--line);
  font-size: 9.5px; font-weight: 800; letter-spacing: .6px; white-space: nowrap; text-transform: uppercase; color: var(--text-3); }
.prio::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.prio.you { color: var(--you); border-color: rgba(78,168,255,.45); } .prio.opponent { color: var(--bot); border-color: rgba(255,111,97,.45); }
.prio.mine { color: var(--gold-2); border-color: var(--gold); animation: prioglow 1.8s ease-in-out infinite; }
@keyframes prioglow { 50% { box-shadow: 0 0 14px rgba(230,180,80,.35); } }
.steps { display: flex; flex-direction: column; gap: 3px; }
.steps .grp { display: flex; align-items: center; gap: 6px; margin: 5px 0 1px; font-size: 9.5px; font-style: italic; color: var(--text-3); }
.steps .grp::before, .steps .grp::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.steps .st { text-align: center; padding: 6px 4px; border-radius: 7px; font-size: 11px; font-weight: 700; letter-spacing: 1px; color: var(--text-2);
  border: 1px solid transparent; transition: background .2s, color .2s; }
.steps .st.main { background: rgba(255,255,255,.035); border-color: var(--line); }
.steps .st.past { color: var(--text-3); opacity: .5; }
.steps .st.on { padding: 10px 4px; font-size: 13px; color: var(--text); letter-spacing: .4px; }
.steps .st.on small { display: block; font-size: 10.5px; font-weight: 500; letter-spacing: 0; color: var(--text-2); margin-top: 3px; }
.steps.you .st.on { border-color: var(--you); background: linear-gradient(180deg, rgba(78,168,255,.28), rgba(78,168,255,.08)); box-shadow: 0 0 16px rgba(78,168,255,.25); }
.steps.opponent .st.on { border-color: var(--bot); background: linear-gradient(180deg, rgba(255,111,97,.28), rgba(255,111,97,.08)); box-shadow: 0 0 16px rgba(255,111,97,.25); }
.legend { margin-top: auto; display: flex; justify-content: center; gap: 10px; padding-top: 8px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: var(--text-3); }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }

/* ---------- the stack (floating) and its links ---------- */
.stackpanel { position: absolute; z-index: 20; display: none; flex-direction: column; min-width: 170px; max-width: min(720px, 60%);
  background: rgba(12, 16, 21, .92); backdrop-filter: blur(8px); border: 1px solid rgba(230,180,80,.45); border-radius: 12px;
  box-shadow: 0 18px 40px rgba(0,0,0,.55); }
.stackpanel.show { display: flex; animation: pop .2s ease-out; }
.sp-h { display: flex; align-items: center; gap: 8px; padding: 7px 12px; cursor: grab; user-select: none; touch-action: none;
  font: 700 13px/1 Cinzel, serif; letter-spacing: .5px; color: var(--gold-2); border-bottom: 1px solid var(--line); }
.sp-h .grip { color: var(--text-3); font-family: Inter, sans-serif; letter-spacing: -1px; }
.sp-h b { margin-left: auto; font: 700 11px/1 Inter, sans-serif; color: var(--text-3); }
.sp-h small { font: 500 10.5px/1 Inter, sans-serif; color: var(--text-3); letter-spacing: 0; }
.sp-body { display: flex; align-items: flex-start; padding: 22px 12px 12px; overflow: hidden; }
.stile { --tw: 124px; position: relative; flex: none; width: var(--tw); border-radius: 9px; background: #141a20; cursor: default;
  border: 1px solid var(--line-2); box-shadow: -6px 0 14px rgba(0,0,0,.45); transition: transform .15s, box-shadow .15s; }
.stile + .stile { margin-left: calc(var(--ov, 0px) * -1); }
.stile:hover, .stile.focus { transform: translateY(-6px); z-index: 50 !important; }
.stile.you { border-color: rgba(78,168,255,.6); } .stile.opponent { border-color: rgba(255,111,97,.6); }
.stile.top { box-shadow: 0 0 0 2px var(--gold), -6px 0 14px rgba(0,0,0,.45); }
.stile .card { position: relative; --cw: calc(var(--tw) - 2px); border-radius: 8px 8px 0 0; box-shadow: none; }
.stile .ab { height: calc((var(--tw) - 2px) * 1.396); display: flex; flex-direction: column; border-radius: 8px 8px 0 0; overflow: hidden; }
.stile .ab .nm { padding: 6px 7px 5px; font-weight: 700; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: rgba(0,0,0,.35); }
.stile .ab .art { height: 34%; background: #222 center 25%/cover; flex: none; }
.stile .ab .kd { padding: 4px 7px 0; font-size: 9px; font-weight: 800; letter-spacing: .8px; text-transform: uppercase; color: #7fb6ff; }
.stile .ab .kd.triggered { color: #c9a0ff; }
.stile .ab .tx { padding: 3px 7px 6px; font-size: 10.5px; line-height: 1.3; color: var(--text); overflow: hidden; flex: 1; }
.stile .ab .tx .ms { width: .95em; height: .95em; }
.stile .tg { padding: 5px 7px; font-size: 10.5px; color: var(--text-2); border-top: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stile .tg b { color: #e3b8ff; font-weight: 600; }
.stile .sn { position: absolute; z-index: 3; left: 8px; top: -13px; }
.stile .res { position: absolute; z-index: 3; right: 6px; top: -10px; font-size: 9px; font-weight: 800; letter-spacing: .8px; padding: 3px 6px; border-radius: 5px;
  background: var(--gold); color: var(--gold-ink); text-transform: uppercase; }
/* Ordering triggers: the ones still to place, the placed ones (draggable), and the lock-in. */
.sp-pending { display: none; flex-direction: column; gap: 6px; padding: 10px 12px 12px; border-top: 1px dashed rgba(230,180,80,.35); background: rgba(230,180,80,.05); }
.sp-pending.show { display: flex; }
.sp-pending .lbl { font-size: 10.5px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--gold-2); }
.sp-pending .lbl span { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--text-3); margin-left: 6px; }
.sp-pending .row { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 2px; scrollbar-width: thin; }
.sp-pending .stile { --tw: 104px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,.4); }
.sp-pending .stile:hover { border-color: var(--gold); transform: translateY(-4px); }
.sp-pending .stile .key { position: absolute; z-index: 3; right: 6px; top: 6px; }
.stile.proposed { cursor: grab; border: 1px dashed var(--gold); }
.stile.proposed:active { cursor: grabbing; }
.stile.dragging { opacity: .35; }
.stile.locked { border: 1px solid var(--gold-2); animation: lockin .55s ease-out forwards; }
@keyframes lockin { 0% { box-shadow: 0 0 0 0 rgba(255,215,120,0); } 35% { box-shadow: 0 0 0 4px rgba(255,215,120,.95), 0 0 34px rgba(255,190,80,.9); filter: brightness(1.35); }
  100% { box-shadow: 0 0 0 2px var(--gold), 0 0 14px rgba(230,180,80,.45); filter: none; } }
.sp-ctl { display: none; gap: 8px; padding: 0 12px 12px; }
.sp-ctl.show { display: flex; }
.sp-ctl .btn { flex: 1; padding: 9px 12px; }
.num { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; font: 800 12px/1 Inter, sans-serif;
  background: #1a140a; color: var(--gold-2); border: 2px solid var(--gold); box-shadow: 0 2px 8px rgba(0,0,0,.6); }
#links { position: fixed; inset: 0; z-index: 35; pointer-events: none; }
#combatLinks { position: fixed; inset: 0; z-index: 33; pointer-events: none; }
#combatLinks svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
#links svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
#links .num { position: absolute; transform: translate(-50%, -50%); }
.card.ln-target, .seat.ln-target { outline: 3px solid #c77dff; outline-offset: 2px; }
.card.ln-source { outline: 2px solid var(--gold); outline-offset: 2px; }
.pinged { border-color: #c77dff !important; color: #f0dcff !important; animation: ping 1.4s ease-in-out infinite; }
@keyframes ping { 50% { box-shadow: 0 0 0 3px rgba(199,125,255,.35), 0 0 16px rgba(199,125,255,.45); } }
.chip.can { border-color: var(--gold); color: var(--gold-2); animation: seatglow 2.2s ease-in-out infinite; }
.hintline { font-size: 12px; color: var(--text-3); line-height: 1.4; }
.hintline b { color: var(--gold-2); font-weight: 600; }
@keyframes pop { from { transform: scale(.9); opacity: 0; } }

/* ---------- seat panels ---------- */
.seat { background: var(--glass); backdrop-filter: blur(8px); border: 1px solid var(--line); border-radius: 14px; padding: 12px;
  box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; transition: border-color .2s, box-shadow .2s; }
.seat.you.active { border-color: rgba(78,168,255,.45); box-shadow: var(--shadow), 0 0 26px rgba(78,168,255,.14); }
.seat.opponent.active { border-color: rgba(255,111,97,.45); box-shadow: var(--shadow), 0 0 26px rgba(255,111,97,.14); }
.seat.can { cursor: pointer; border-color: var(--gold); animation: seatglow 2.2s ease-in-out infinite; }
.seat.marked { border-color: #fff; }
@keyframes seatglow { 50% { box-shadow: var(--shadow), 0 0 0 2px rgba(230,180,80,.5), 0 0 26px rgba(230,180,80,.35); } }
.seat .who { display: flex; align-items: center; gap: 10px; }
.avatar { width: 46px; height: 46px; border-radius: 50%; background: #1b2229 center 25%/cover; flex: none;
  border: 2px solid var(--line-2); box-shadow: 0 4px 12px rgba(0,0,0,.45); }
.seat.you .avatar { border-color: var(--you); } .seat.opponent .avatar { border-color: var(--bot); }
.seat .who > div:nth-child(2) { min-width: 0; }
.seat .name { font-weight: 700; font-size: 14px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seat .sub { font-size: 11.5px; color: var(--text-3); }
.life { margin-left: auto; text-align: right; }
.life b { display: block; font: 800 30px/1 Inter, sans-serif; letter-spacing: -.5px; transition: color .4s; }
.life span { font-size: 9.5px; letter-spacing: 1.3px; text-transform: uppercase; color: var(--text-3); }
.life.hit b { color: var(--bad); animation: shake .35s; } .life.heal b { color: var(--good); }
@keyframes shake { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
.chips { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.chip { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 9px; background: rgba(255,255,255,.04);
  border: 1px solid var(--line); font-size: 11.5px; color: var(--text-2); min-width: 0; }
.chip { overflow: hidden; white-space: nowrap; }
.chip b { margin-left: auto; color: var(--text); font-weight: 700; }
.chip svg { width: 14px; height: 14px; opacity: .7; flex: none; }
button.chip { cursor: pointer; text-align: left; }
button.chip:hover { border-color: var(--line-2); background: rgba(255,255,255,.08); }
.chip.alert { border-color: rgba(255,107,107,.45); color: #ffc9c4; }
.pool { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.pool i { font-style: normal; font-size: 10px; font-weight: 700; letter-spacing: 1.1px; text-transform: uppercase; color: var(--text-3); margin-right: 2px; }
.pool em { font-style: normal; font-size: 11.5px; color: var(--text-3); }
.pool span { display: inline-flex; align-items: center; gap: 3px; padding: 2px 7px 2px 3px; background: rgba(0,0,0,.35); border-radius: 12px; font-weight: 700; font-size: 12px; }
.cmdzone { display: flex; gap: 10px; align-items: center; padding-top: 2px; }
.cmdzone .card { --cw: 44px; position: relative; flex: none; }
.cmdzone .lbl { font-size: 11px; color: var(--text-3); line-height: 1.35; min-width: 0; }
.cmdzone .lbl b { display: block; color: var(--text-2); font-size: 10px; letter-spacing: 1.1px; text-transform: uppercase; }
.backs { display: flex; padding-left: 8px; height: 30px; }
.backs i { width: 21px; height: 30px; margin-left: -9px; border-radius: 3px; border: 1px solid rgba(0,0,0,.7);
  background: radial-gradient(ellipse 40% 30% at 50% 50%, #c08a3e 0 40%, #6b4519 41% 60%, transparent 62%), linear-gradient(135deg, #3d2b19, #1b120a);
  box-shadow: 1px 1px 3px rgba(0,0,0,.5); }

/* ---------- cards ---------- */
.slot { position: relative; flex: none; width: var(--cw); height: var(--ch); transition: width .22s ease, transform .22s ease; }
/* Declaring attackers: a chosen creature turns a little (it taps for real once declared). */
.slot.atk-sel { transform: rotate(15deg); }
.slot.tapped { width: var(--ch); }
.slot.has-att { margin-top: calc(var(--ch) * .2); }
.card { position: absolute; left: 0; top: 0; width: var(--cw); height: calc(var(--cw) * 1.396); border-radius: calc(var(--cw) * .055);
  background: #1e252c; overflow: hidden; box-shadow: 0 3px 8px rgba(0,0,0,.55), 0 0 0 1px rgba(0,0,0,.6);
  transition: transform .22s ease, box-shadow .15s, filter .2s; cursor: default; user-select: none; }
.slot.tapped > .card { transform: translateX(calc((var(--ch) - var(--cw)) / 2)) rotate(90deg); }
.card img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
.card.dim { filter: saturate(.2) brightness(.5); }
.card .frame { position: absolute; inset: 0; padding: 7% 8%; display: flex; flex-direction: column; gap: 3%;
  background: linear-gradient(160deg, var(--f1, #4a5560), var(--f2, #20262c)); border: max(2px, calc(var(--cw) * .035)) solid #0c0f12; border-radius: inherit; }
.card .frame .nm { font-weight: 700; font-size: max(8.5px, calc(var(--cw) * .112)); line-height: 1.15; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
.card .frame .cs { font-size: max(8px, calc(var(--cw) * .1)); }
.card .frame .tp { font-size: max(7px, calc(var(--cw) * .084)); color: rgba(255,255,255,.75); border-top: 1px solid rgba(255,255,255,.2); padding-top: 4%; }
.card .frame .tx { font-size: max(6.5px, calc(var(--cw) * .076)); color: rgba(255,255,255,.85); overflow: hidden; line-height: 1.25; flex: 1; }
.card .frame .ms { width: .95em; height: .95em; }
.badge { position: absolute; z-index: 2; font-weight: 800; font-size: max(9.5px, calc(var(--cw) * .12)); line-height: 1; padding: 3px 5px; border-radius: 6px;
  background: rgba(10, 12, 15, .9); color: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.6); white-space: nowrap; pointer-events: none; }
.badge.pt { right: 4%; bottom: 3%; border: 1px solid rgba(255,255,255,.28); }
.badge.pt.hurt { color: #ffb1a8; border-color: rgba(255,107,107,.65); }
.badge.cnt { left: 4%; top: 4%; background: var(--gold); color: var(--gold-ink); }
.badge.ctr { left: 4%; bottom: 3%; background: rgba(18, 76, 46, .94); color: #bdf7d4; max-width: 60%; overflow: hidden; text-overflow: ellipsis; }

.badge.combat.blk { background: rgba(28, 104, 196, .94); }
.badge.phase { left: 50%; top: 50%; transform: translate(-50%, -50%); background: rgba(70, 70, 110, .92); }
.slot > .card { z-index: 1; }
.slot.stacked::before, .slot.stacked::after { content: ""; position: absolute; z-index: 0; left: 0; top: 0; width: var(--cw); height: var(--ch);
  border-radius: calc(var(--cw) * .055); background: #12161a; box-shadow: 0 0 0 1px rgba(0,0,0,.65); }
.slot.stacked::before { transform: translate(6px, -6px); } .slot.stacked::after { transform: translate(3px, -3px); }
.slot.tapped.stacked::before { transform: translate(calc((var(--ch) - var(--cw)) / 2 + 6px), -6px) rotate(90deg); }
.slot.tapped.stacked::after { transform: translate(calc((var(--ch) - var(--cw)) / 2 + 3px), -3px) rotate(90deg); }
.card.attacking { box-shadow: 0 0 0 2px var(--bot), 0 0 18px rgba(255,111,97,.6); }

.card.can:hover { filter: brightness(1.12); }

.card.tap { cursor: pointer; }
.card.tap:hover { filter: brightness(1.12); box-shadow: 0 0 0 2px rgba(230,180,80,.6), 0 0 12px rgba(230,180,80,.35); }
/* Declare attackers: creatures still to be asked burn red; the one being asked burns brighter. */
.card.atk-ready { animation: ready 1.6s ease-in-out infinite; }
@keyframes ready { 0%, 100% { box-shadow: 0 0 0 2px rgba(255,77,46,.75), 0 0 10px rgba(255,90,40,.35); } 50% { box-shadow: 0 0 0 2px #ff6a3d, 0 0 20px rgba(255,90,40,.6); } }
.card.atk-now, .card.can.atk-now { animation: now 1s ease-in-out infinite; }
@keyframes now { 0%, 100% { box-shadow: 0 0 0 3px #ff5a2a, 0 0 18px rgba(255,110,40,.7), 0 0 40px rgba(255,60,20,.35); }
  50% { box-shadow: 0 0 0 3px #ffb347, 0 0 28px rgba(255,140,50,.9), 0 0 60px rgba(255,60,20,.5); } }
.slot.lunge { animation: lunge .55s cubic-bezier(.3, 1.4, .5, 1); z-index: 5; }
@keyframes lunge { 0% { transform: none; } 35% { transform: translateY(var(--lunge, -18px)) scale(1.08); } 100% { transform: none; } }

.att { position: absolute; left: 0; width: var(--cw); }

/* ---------- hand ---------- */

.revealed .card { position: relative; }

@keyframes breathe { 50% { box-shadow: 0 0 0 7px rgba(255,111,97,.12); } }

.zonecards { display: flex; flex-wrap: wrap; gap: 10px; --cw: 104px; max-width: 860px; }
.zonecards .card { position: relative; }
.lobby { width: min(900px, 94vw); }
.lobby .tag { color: var(--text-3); font-size: 13px; margin: 6px 0 0; }
.lobby .sect { margin-top: 20px; }
.lobby .sect h3 { margin: 0 0 10px; font-size: 11px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--text-3); display: flex; align-items: center; gap: 8px; }

.decks { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.deck { position: relative; height: 132px; border-radius: 14px; overflow: hidden; cursor: pointer; border: 2px solid transparent;
  background: #1b2229 center 22%/cover; box-shadow: 0 8px 20px rgba(0,0,0,.4); transition: transform .12s, border-color .12s, filter .12s; text-align: left; padding: 0; filter: saturate(.75) brightness(.8); }

.deck:hover { transform: translateY(-2px); filter: none; }
.deck .dn { position: absolute; left: 14px; right: 14px; bottom: 12px; z-index: 1; }
.deck .dn b { display: block; font: 700 18px/1.2 Cinzel, serif; color: #fff; }
.deck .dn span { font-size: 12px; color: rgba(255,255,255,.78); }
.deck.sel { border-color: var(--gold); filter: none; box-shadow: 0 0 0 3px rgba(230,180,80,.22), 0 10px 24px rgba(0,0,0,.5); }

  background: var(--gold); color: var(--gold-ink); font-weight: 800; display: grid; place-items: center; font-size: 13px; }
.lobby .opts-row { display: flex; gap: 28px; flex-wrap: wrap; }
.seg { display: inline-flex; padding: 3px; gap: 3px; background: rgba(0,0,0,.35); border: 1px solid var(--line); border-radius: 11px; }
.seg button { border: 0; background: transparent; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; color: var(--text-2); }
.seg button:hover { color: var(--text); }

.lobby .foot .btn { padding: 12px 28px; font-size: 15px; }
.splash { text-align: center; padding: 44px 56px; }

.result { text-align: center; padding: 34px 48px 30px; min-width: min(380px, 90vw); }
.result .crest { font-size: 44px; line-height: 1; margin-bottom: 10px; }
.result h2 { font-size: 34px; }
.result.win h2 { color: var(--gold-2); } .result.loss h2 { color: #ffb0a8; }
.result p { color: var(--text-2); margin: 8px 0 24px; }
.result .row { display: flex; gap: 10px; justify-content: center; }
.banner { position: fixed; left: 0; right: calc(var(--side) + var(--flow)); top: 45%; z-index: 40; pointer-events: none; display: flex; justify-content: center; opacity: 0; }
.banner.show { animation: banner 1.6s ease-out; }
.banner div { padding: 14px 80px; font: 700 30px/1 Cinzel, serif; letter-spacing: 1px;
  background: linear-gradient(90deg, transparent, rgba(0,0,0,.78) 22%, rgba(0,0,0,.78) 78%, transparent); }
.banner.you div { color: var(--you); } .banner.opponent div { color: var(--bot); }
@keyframes banner { 0% { opacity: 0; transform: scale(.95); } 15%, 70% { opacity: 1; transform: scale(1); } 100% { opacity: 0; } }
.spot { position: absolute; z-index: 30; left: 50%; top: 50%; pointer-events: none; display: flex; flex-direction: column; align-items: center; gap: 10px;
  transform: translate(-50%, -50%); animation: spot 2.2s ease-in-out forwards; }
.spot img, .spot .card { width: clamp(150px, 13vw, 230px); height: auto; border-radius: 12px; box-shadow: 0 0 0 2px rgba(255,111,97,.6), 0 24px 60px rgba(0,0,0,.75); }

  background: rgba(0,0,0,.7); padding: 5px 12px; border-radius: 20px; border: 1px solid rgba(255,111,97,.5); }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 90; padding: 10px 16px; border-radius: 10px;
  background: #3a1d1d; border: 1px solid rgba(255,107,107,.5); color: #ffd6d2; display: none; box-shadow: var(--shadow); }
/* Card viewer: cards a choice is made among, or that were revealed or looked at. */
.viewer { position: fixed; inset: 0; z-index: 55; display: none; align-items: center; justify-content: center; padding: 20px; background: rgba(3, 5, 8, .55); }
.viewer.show { display: flex; animation: fade .18s ease-out; }
.vbox { background: linear-gradient(180deg, #171d25, #0f141a); border: 1px solid rgba(230,180,80,.45); border-radius: 16px; box-shadow: 0 30px 80px rgba(0,0,0,.6);
  max-width: min(1180px, 96vw); max-height: 92vh; display: flex; flex-direction: column; animation: rise .22s ease-out; }
.vh { display: flex; align-items: flex-start; gap: 18px; padding: 18px 22px 12px; border-bottom: 1px solid var(--line); }
.vh > div { flex: 1; min-width: 0; }
.vl { font-size: 11px; font-weight: 800; letter-spacing: 2.4px; text-transform: uppercase; color: var(--gold); }
.vt { margin-top: 4px; font: 600 17px/1.35 Inter, sans-serif; color: var(--text); }
.vcards { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; padding: 20px 22px; overflow: auto; --cw: clamp(120px, 11vw, 168px); }
.vcards .card { position: relative; }
.vcards.picking .card:not(.can) { filter: saturate(.25) brightness(.5); }
.vf { display: flex; justify-content: flex-end; gap: 10px; padding: 12px 22px 18px; border-top: 1px solid var(--line); }
.vf .btn { padding: 10px 22px; font-size: 14px; }
.empty-field { margin: auto; color: var(--text-3); font-size: 13px; }

@media (max-width: 1100px) {
  :root { --side: 280px; --rail: 196px; --flow: 96px; }
  .steps .st { font-size: 10px; letter-spacing: .5px; } .steps .st.on small { display: none; }
  .matchup { display: none; }
  .avatar { width: 38px; height: 38px; }
  .life b { font-size: 26px; }

}
@media (max-width: 760px) {
  html, body { overflow: auto; }
  #app { height: auto; min-height: 100vh; }
  main { grid-template-columns: 1fr; }
  .table { grid-template-columns: 1fr; grid-template-rows: auto; }
  .rail { padding: 10px; }

  .field { min-height: 170px; }
  .handbar { height: calc(var(--hh) + 20px); } .hand { bottom: 10px; }

<body>
<div id="app">

  h("div", { class: "row" }, h("button", { class: "btn gold", onclick: async () => { closeDialog(); try { await post("/api/concede"); } catch (e) { toast(e.message); } } }, "Concede"),
    h("button", { class: "btn", onclick: closeDialog }, "Keep playing"))));
$("passTurn").onclick = () => { if (view && view.state) { passTurn = view.state.turn; passUntil = false; autoPass(); } };
$("passMine").onclick = () => { passUntil = true; passTurn = null; autoPass(); };
for (const id of ["autoEmpty", "autoOwn", "autoMana", "stopMana"]) { $(id).checked = load(id, !["autoMana", "stopMana"].includes(id)); $(id).onchange = () => { store(id, $(id).checked); autoPass(); }; }
document.addEventListener("keydown", (ev) => {
  if (["INPUT", "SELECT", "TEXTAREA"].includes(ev.target.tagName)) return;
  if (ev.key === "Escape" && viewerMode) { if (viewerMode === "decision") { viewerHidden = view.decision && view.decision.decision; hideViewer(); viewerMode = null; } else showSeen(); return; }
  if (ev.key === "Escape" && arming) { arming = null; drawCombat(); render(); return; }
  if (ev.key === "Escape") { hideMenu(); if ($("scrim").classList.contains("show") && dismissible()) closeDialog(); return; }
  if ($("scrim").classList.contains("show")) return;
  // A held key repeats, and a key pressed just as a new decision appears would answer
  // something the player has not seen yet.
  // After a new turn starts, wait a little longer: the opponent's turn may have gone by
  // between the player's last look and this key.
  if (ev.repeat || performance.now() - decisionShownAt < 300 || performance.now() - turnChangedAt < 1200) return;
  const d = view && view.decision;
  if (d && d.kind === "triggers" && orderState()) {
    if (ev.key === " " || ev.key === "Enter") { ev.preventDefault(); confirmOrder(); }
    else if (/^[1-9]$/.test(ev.key)) { const o = pendingItems()[Number(ev.key) - 1]; if (o) placeTrigger(o.id); }
    return;
  }
  if (ev.key === " " || ev.key === "Enter") {
    if (d && primary) { ev.preventDefault(); typeof primary === "function" ? primary() : answer(primary, "key " + JSON.stringify(ev.key)); }
    return;
  }
  if (/^[1-9]$/.test(ev.key) && d && hotkeys[Number(ev.key) - 1]) { answer(hotkeys[Number(ev.key) - 1], "key " + ev.key); return; }
  if (ev.key === "e" || ev.key === "E") $("passTurn").click();
  if (ev.key === "t" || ev.key === "T") $("passMine").click();
});
let resizeTimer = null;
addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => view && view.state && render(), 120); });
claim();
addEventListener("focus", () => { if (view && !inControl()) return; claim(); });
fetch("/api/decks").then((r) => r.json()).then((j) => {
  if (!decks.length) decks = j.decks || [];
  decks.forEach((d) => (d.names || []).forEach((n) => img(n, () => {})));
}).catch(() => {});
poll();
</script>
